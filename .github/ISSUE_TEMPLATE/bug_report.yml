name: Bug report
description: Report a problem with videolore
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not use this form for security problems: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: videolore version
      description: Shown in the README and in the release you use, for example 3.1.3.
      placeholder: "3.1.3"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Name and version, for example Ubuntu 24.04 or Windows 11.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that reproduce the problem.
      placeholder: |
        1. Open the project
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Paste text logs or attach screenshots.
    validations:
      required: false
