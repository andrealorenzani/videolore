name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is hard or impossible today, and why.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like videolore to do.
    validations:
      required: true
