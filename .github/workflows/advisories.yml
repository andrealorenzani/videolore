name: Security advisories

# The dependency advisory check also runs every week, so a new advisory about a library that
# is already built in shows up without waiting for the next push (REQ-226). It cannot write
# anything: read-only, no secrets.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - name: Advisories of every locked dependency
        run: cargo deny --locked check advisories
