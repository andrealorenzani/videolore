name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the job that attaches files to a release may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, coverage, version
    # Pinned runner image (the floating Ubuntu label moves to new releases on its own).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Integration tests must not be skipped in CI.
      VIDEOLORE_REQUIRE_FFMPEG: "1"
      # Real speech recognition tests (the three speech files are cached below).
      VIDEOLORE_STT_MODEL: ${{ github.workspace }}/.stt-model/ggml-tiny-q5_1.bin
      # A missing speech model or fixture fails the speech tests instead of skipping them.
      VIDEOLORE_REQUIRE_STT: "1"
      VIDEOLORE_STT_MODELS_DIR: ${{ github.workspace }}/.stt-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - name: System packages (ALSA headers, whisper.cpp build, speech fixture)
        # Only what the runner image lacks (cmake and pkg-config are on the image; the build fails
        # loudly if that ever changes); the package index is refreshed only when needed.
        run: |
          missing=""
          for p in libasound2-dev libclang-dev espeak-ng; do dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"; done
          if [[ -n "$missing" ]]; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Bump when .cargo/config.toml changes the whisper.cpp build flags: whisper-rs-sys
          # does not rebuild on its own, so an old cache would keep the old (native) build.
          prefix-key: v2-rust-ggml-portable
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-llvm-cov,cargo-deny@0.20.2,cargo-about@0.9.3
      - name: ffmpeg of the tests is the pinned build the installers ship (QG-07, QG-08)
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-test
          key: ffmpeg-test-${{ hashFiles('packaging/ffmpeg.lock', 'scripts/fetch-ffmpeg.sh') }}
      - name: Download the pinned ffmpeg (SHA-256 checked, smoke tested)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg.sh linux-x86_64 "$RUNNER_TEMP/ffmpeg-test"
      - name: Tests use the pinned ffmpeg and ffprobe
        run: |
          echo "VIDEOLORE_FFMPEG=$RUNNER_TEMP/ffmpeg-test/ffmpeg" >> "$GITHUB_ENV"
          echo "VIDEOLORE_FFPROBE=$RUNNER_TEMP/ffmpeg-test/ffprobe" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ffmpeg-test" >> "$GITHUB_PATH"
      - name: cargo-about is the pinned version
        run: |
          cargo about --version | tee /dev/stderr | grep -qx 'cargo-about 0.9.3'
      - name: Speech files for the real transcription tests (cached, checked by SHA-256)
        id: stt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .stt-model
          key: stt-models-818710568da3ca15-ae85e4a935d7a567-394221709cd5ad1f
      - name: Download the speech files
        if: steps.stt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .stt-model
          base=https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1
          for f in ggml-tiny-q5_1.bin ggml-small-q5_1.bin ggml-large-v3-turbo-q5_0.bin; do
            curl -fsSL --retry 3 -o ".stt-model/$f" "$base/$f"
          done
          sha256sum -c - <<'SUMS'
          818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  .stt-model/ggml-tiny-q5_1.bin
          ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  .stt-model/ggml-small-q5_1.bin
          394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  .stt-model/ggml-large-v3-turbo-q5_0.bin
          SUMS
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: cargo test --locked (both programs), with code coverage >= 85% (one instrumented run)
        # The tests run once, instrumented: the same pass gives the results and the line
        # coverage of the whole workspace (src/main.rs and player/src/main.rs excluded, as
        # in scripts/coverage.sh). On failure the failing
        # tests and their panic messages also become error annotations (readable without
        # logging in, through the public check-run annotations).
        run: |
          set -o pipefail
          cargo llvm-cov --locked --workspace --ignore-filename-regex 'src/main\.rs$' \
            --fail-under-lines 85 --summary-only 2>&1 | tee "$RUNNER_TEMP/cargo-test.txt" || {
            scripts/test-annotations.sh "$RUNNER_TEMP/cargo-test.txt"
            exit 1
          }
      - name: videolore player has no network and no speech code
        # The player's dependency graph must not contain the speech engine or the HTTP
        # client (the editor's only network use): the no-network rule is checked here.
        run: |
          tree=$(cargo tree --locked -p videolore-player -e normal --prefix none)
          if grep -E '^(ureq|whisper-rs|whisper-rs-sys|rustls) ' <<<"$tree"; then
            echo "videolore player must not depend on network or speech crates" >&2
            exit 1
          fi
      - name: Licences, advisories and crate sources (cargo-deny)
        run: cargo deny --locked check
      - name: Rust crate notices are up to date (editor and player)
        run: |
          scripts/notices.sh --check
      - name: Version is the same everywhere
        run: scripts/version.sh check
      - name: Feature coverage = 100%
        run: scripts/feature-coverage.sh
      - name: Released docs are unchanged
        run: scripts/release-guard.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  package-config:
    # The installer configuration is checked on every push and pull request, without ffmpeg
    # and without the real installers (QG-10): the Windows and macOS packager files, and a
    # Linux AppImage made of stub programs with the pinned appimagetool. Nothing is uploaded.
    name: installer configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Windows and macOS packager configuration
        run: |
          for t in windows-x86_64 macos-aarch64; do
            for p in editor player; do
              scripts/package.sh "$t" "$p" --config-only
            done
          done
          for f in dist/stage-windows-x86_64/Packager.toml dist/stage-windows-x86_64-player/Packager.toml \
                   dist/stage-macos-aarch64/Packager.toml dist/stage-macos-aarch64-player/Packager.toml; do
            for key in '^name = ' '^identifier = ' '^version = ' '^formats = ' '^binaries = ' '^icons = ' '^resources = '; do
              grep -q "$key" "$f" || { echo "$f: no line matching $key" >&2; exit 1; }
            done
          done
          grep -q '^formats = \["nsis"\]' dist/stage-windows-x86_64/Packager.toml
          grep -q '^formats = \["app"\]' dist/stage-macos-aarch64/Packager.toml
          grep -q '^installMode = "currentUser"' dist/stage-windows-x86_64/Packager.toml
      - name: Linux AppImage from stub programs (pinned appimagetool, checksum checked)
        run: |
          version=$(scripts/version.sh get)
          for p in editor player; do
            scripts/package.sh linux-x86_64 "$p" --stub
          done
          ls dist/stub/videolore-${version}-linux-x86_64.AppImage dist/stub/videolore-player-${version}-linux-x86_64.AppImage
          for n in videolore videolore-player; do
            d=dist/stub/stage-linux-x86_64
            [[ $n == videolore-player ]] && d=dist/stub/stage-linux-x86_64-player
            for f in AppRun $n.desktop $n.png usr/bin/$n usr/bin/ffmpeg usr/bin/ffprobe usr/share/$n/notices/third-party.txt; do
              [[ -e $d/AppDir/$f ]] || { echo "AppDir of $n lacks $f" >&2; exit 1; }
            done
          done

  msrv:
    # MSRV equals the latest stable Rust by policy: this job only proves it builds with
    # exactly that version (the tests run once, in the check job).
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          [[ -n "$v" ]] || { echo "rust-version missing from Cargo.toml"; exit 1; }
          echo "MSRV is $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: System packages (ALSA headers, whisper.cpp build)
        # Only what the runner image lacks (cmake and pkg-config are on the image; the build fails
        # loudly if that ever changes); the package index is refreshed only when needed.
        run: |
          missing=""
          for p in libasound2-dev libclang-dev; do dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"; done
          if [[ -n "$missing" ]]; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Bump when .cargo/config.toml changes the whisper.cpp build flags: whisper-rs-sys
          # does not rebuild on its own, so an old cache would keep the old (native) build.
          prefix-key: v2-rust-ggml-portable
      - run: cargo build --locked --workspace --all-targets

  build:
    # Bare executables on every push and pull request (artifacts only; releases get the
    # installers from the package job).
    name: executable (${{ matrix.target }})
    needs: [check, msrv]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-15, target: aarch64-apple-darwin, ext: "" }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: System packages (ALSA headers, whisper.cpp build)
        if: runner.os == 'Linux'
        # Only what the runner image lacks (cmake and pkg-config are on the image; the build fails
        # loudly if that ever changes); the package index is refreshed only when needed.
        run: |
          missing=""
          for p in libasound2-dev libclang-dev; do dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"; done
          if [[ -n "$missing" ]]; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
      - name: libclang for bindgen (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Bump when .cargo/config.toml changes the whisper.cpp build flags: whisper-rs-sys
          # does not rebuild on its own, so an old cache would keep the old (native) build.
          prefix-key: v2-rust-ggml-portable
      - name: Build release executables (the editor and videolore player)
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}
      - name: Name the executables
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "videolore") | .version')
          for name in videolore videolore-player; do
            out="${name}-${version}-${{ matrix.target }}${{ matrix.ext }}"
            cp "target/${{ matrix.target }}/release/${name}${{ matrix.ext }}" "$out"
          done
          echo "ASSET=videolore-${version}-${{ matrix.target }}${{ matrix.ext }}" >> "$GITHUB_ENV"
          echo "PLAYER_ASSET=videolore-player-${version}-${{ matrix.target }}${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PLAYER_ASSET }}
          path: ${{ env.PLAYER_ASSET }}

  package:
    # Installers with the bundled ffmpeg, on release tags (v*) and on demand.
    name: installers (${{ matrix.target }})
    needs: [check, msrv]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x86_64 }
          - { os: macos-15, target: macos-aarch64 }
          - { os: windows-2025, target: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: System packages (ALSA headers, whisper.cpp build)
        if: runner.os == 'Linux'
        # Only what the runner image lacks (cmake and pkg-config are on the image; the build fails
        # loudly if that ever changes); the package index is refreshed only when needed.
        run: |
          missing=""
          for p in libasound2-dev libclang-dev; do dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"; done
          if [[ -n "$missing" ]]; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
      - name: libclang for bindgen (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Bump when .cargo/config.toml changes the whisper.cpp build flags: whisper-rs-sys
          # does not rebuild on its own, so an old cache would keep the old (native) build.
          prefix-key: v2-rust-ggml-portable
      - name: cargo-packager (pinned in packaging/tools.lock)
        if: runner.os != 'Linux'
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Fetch the pinned ffmpeg (SHA-256 checked)
        run: scripts/fetch-ffmpeg.sh ${{ matrix.target }} dist/ffmpeg-${{ matrix.target }}
      - name: Build release executables (the editor and videolore player)
        run: cargo build --release --locked --workspace
      - name: Build the installers of the editor (with the ffmpeg smoke test)
        run: scripts/package.sh ${{ matrix.target }}
      - name: Build the installers of videolore player (same pinned ffmpeg, own name and identifier)
        run: scripts/package.sh ${{ matrix.target }} player
      - name: Third-party source archive
        if: runner.os == 'Linux'
        run: scripts/package.sh sources
      - name: Release notes
        run: |
          v="$(scripts/version.sh get)"
          notes=""
          for f in releases/"$v - "*/RELEASE_NOTES.md; do [[ -f "$f" ]] && notes="$f"; done
          [[ -n "$notes" ]] || notes=docs/changelog.md
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.target }}
          path: dist/videolore-*
      - name: Attach to the GitHub release (tags v* only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: ${{ env.NOTES }}
          files: |
            dist/*-setup.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/*-third-party-source.tar.xz
