name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, coverage, version
    runs-on: ubuntu-latest
    env:
      # Integration tests must not be skipped in CI.
      VIDEOLORE_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: System packages (ffmpeg for tests, ALSA headers for cpal)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Version is the same everywhere
        run: scripts/version.sh check
      - name: Code coverage >= 85%
        run: scripts/coverage.sh --fail-under 85
      - name: Feature coverage = 100%
        run: scripts/feature-coverage.sh
      - name: Released docs are unchanged
        run: scripts/release-guard.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  msrv:
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    env:
      VIDEOLORE_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          [[ -n "$v" ]] || { echo "rust-version missing from Cargo.toml"; exit 1; }
          echo "MSRV is $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: System packages (ffmpeg for tests, ALSA headers for cpal)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
      - run: cargo test --locked

  build:
    name: executable (${{ matrix.target }})
    needs: [check, msrv]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: System packages (ALSA headers for cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Build release executable
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          out="${name}-${version}-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/${name}${{ matrix.ext }}" "$out"
          echo "ASSET=$out" >> "$GITHUB_ENV"
          notes="release/${version}/docs/changelog.md"
          [[ -f "$notes" ]] && echo "NOTES=$notes" >> "$GITHUB_ENV" || true
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
      - name: Create/attach GitHub release (tags v* only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}
          body_path: ${{ env.NOTES }}
