[package]
name = "videolore"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
authors = ["Andrea Lorenzani"]
readme = "README.md"
description = "Non-destructive video editor for short social videos, built on ffmpeg"

[features]
default = ["audio"]
# Audio output for the preview (cpal). Without it the preview is silent and video-clocked.
audio = ["dep:cpal"]
# Reserved for speech-to-text subtitles (planned, empty for now).
stt = []

[dependencies]
cpal = { version = "0.18.2", optional = true }
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
sha2 = "0.11.1"
