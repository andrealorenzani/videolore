[workspace]
members = ["player"]
default-members = ["."]
resolver = "3"

[package]
name = "videolore"
version = "2.3.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
authors = ["Andrea Lorenzani"]
readme = "README.md"
description = "Non-destructive video editor for short social videos, built on ffmpeg"

[lib]
# There are no documentation examples: skip the empty doc-test pass of `cargo test`.
doctest = false

# Faster test builds: line tables are enough for test failures and coverage.
[profile.dev]
debug = "line-tables-only"

[features]
default = ["audio", "stt"]
# Audio output for the preview (cpal). Without it the preview is silent and wall-clocked.
audio = ["dep:cpal"]
# Speech-to-text subtitle generation (whisper.cpp through whisper-rs) and the one-time model
# download (ureq). Needs cmake, a C++ compiler and libclang to build.
stt = ["dep:whisper-rs", "dep:ureq"]

[dependencies]
cpal = { version = "0.18.2", optional = true }
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11"] }
fontdb = "0.24.0"
harfrust = "0.12.0"
image = { version = "0.25.10", default-features = false, features = ["gif"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
skrifa = "0.44.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = { version = "3.5.2", optional = true, default-features = false, features = ["rustls"] }
whisper-rs = { version = "0.16.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSObject", "NSString", "NSURL"] }
# The menu bar (REQ-232): Hide, Hide Others, Minimize; already in the lock through winit.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder"] }
# Only to switch off winit's default macOS menu (Cmd+Q must reach the app); same version
# and features as eframe's.
winit = { version = "0.30.13", default-features = false }

[dev-dependencies]
# Parses the sources in tests/module_cycles.rs (already in the lock through the derive crates).
syn = { version = "2", features = ["full", "visit"] }
