<?xml version="1.0" encoding="UTF-8"?>
<!-- videolore application icon. Original design for the videolore project.
     SPDX-License-Identifier: GPL-3.0-only — Copyright (C) 2026 Andrea Lorenzani -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1d6e"/>
      <stop offset="0.55" stop-color="#7a2a8c"/>
      <stop offset="1" stop-color="#f06a3c"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1e9ff"/>
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>
  <!-- three stacked clips, like a timeline seen from above -->
  <rect x="196" y="250" width="632" height="96" rx="40" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="196" y="250" width="300" height="96" rx="40" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="196" y="678" width="632" height="96" rx="40" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="528" y="678" width="300" height="96" rx="40" fill="#ffffff" fill-opacity="0.55"/>
  <!-- the story card in the middle with a play mark -->
  <rect x="196" y="386" width="632" height="252" rx="56" fill="url(#page)"/>
  <path d="M 452 446 L 452 578 L 572 512 Z" fill="#7a2a8c" stroke="#7a2a8c" stroke-width="24" stroke-linejoin="round"/>
  <!-- playhead -->
  <rect x="694" y="214" width="20" height="596" rx="10" fill="#ffd166"/>
  <circle cx="704" cy="214" r="34" fill="#ffd166"/>
</svg>
