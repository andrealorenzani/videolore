# cargo-deny configuration (checked in CI): licences, security advisories, banned or
# duplicate crates and crate sources.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
# Unmaintained crates deep in the GUI stack are reported but do not fail the build.
unmaintained = "workspace"
# A yanked crate version fails the build like a vulnerability.
yanked = "deny"
# Advisories known not to affect videolore. Every entry needs its reason, e.g.
#   "RUSTSEC-2026-0000", # only in the X feature, which videolore does not enable
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OFL-1.1",
    # egui's default UI fonts (Ubuntu-Light).
    "Ubuntu-font-1.0",
    "GPL-3.0-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
